
spring:
  application:
    name: notificationService
  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    username: user
    url: jdbc:postgresql://notification-service-db:5435/notificationService
    password: postgres
  flyway:
    enabled: true
    repair-on-migrate: true
    locations: classpath:db/migration
    # false (padrão): se o banco já tiver tabelas sem histórico do Flyway,
    # o startup FALHA em vez de carimbar um baseline e pular as migrations.
    # Em banco novo isso não interfere em nada.
    baseline-on-migrate: false
  data:
    redis:
      password: admin
      host: my-redis
      port: 6379
      type: redis
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8081/realms/ChainTracker
      client:
        registration:
          notification-service:
            provider: keycloak
            client-id: notification-client
            client-secret: ${NOTIFICATION_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - bot
        provider:
          keycloak:
            token-uri: http://keycloak:8081/realms/ChainTracker/protocol/openid-connect/token

  kafka:
    listener:
      type: batch
notification:
  telegram:
    bot-name: "ChainTrackerPortfolioBot"
    key: ${TELEGRAM_KEY}
  discord:
    token: ${DISCORD_TOKEN}
    webhook-url: ${DISCORD_WEBHOOK_URL}
server:
  port: 8086

