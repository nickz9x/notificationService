
spring:
  application:
    name: notificationService
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    username: user
    url: jdbc:postgresql://localhost:5435/notificationService
    password: postgres
  flyway:
    enabled: false
    repair-on-migrate: true
    locations: classpath:db/migration
    # false (padrão): se o banco já tiver tabelas sem histórico do Flyway,
    # o startup FALHA em vez de carimbar um baseline e pular as migrations.
    # Em banco novo isso não interfere em nada.
    baseline-on-migrate: false
  data:
    redis:
      password: admin
      host: localhost
      port: 6379
      type: redis
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/ChainTracker
      client:
        registration:
          notification-service:
            provider: keycloak
            client-id: notification-client
            client-secret: "ZtLcll0k4OS1Ff0yK9uMLU2U0XvVgw7Yg8OCBfmozgElmrqRNMBjZPWZVmuootmEq2dPj4n7KMa3Yx2409X8KF"
            authorization-grant-type: client_credentials
            scope:
              - bot
        provider:
          keycloak:
            token-uri: http://localhost:8081/realms/ChainTracker/protocol/openid-connect/token

  kafka:
    listener:
      type: batch
